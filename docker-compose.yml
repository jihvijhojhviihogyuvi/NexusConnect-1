version: '3.8'

services:
  nexusconnect:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
    # Memory optimization: Set container memory limits
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 300M
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/auth/user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s